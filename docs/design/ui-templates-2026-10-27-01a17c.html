&lt;style&gt;
#fp-directions{width:100%}
#fp-directions .fp-app{--fp-bg:light-dark(#f2f3ed,#181e1a);--fp-panel:light-dark(#fafbf6,#1e2620);--fp-paper:light-dark(#ffffff,#252e27);--fp-ink:light-dark(#26382c,#e3ebe4);--fp-muted:light-dark(#647267,#a3b3a7);--fp-line:light-dark(#dbe1d8,#39483c);--fp-accent:light-dark(#325a40,#a4cbae);--fp-onaccent:light-dark(#fff,#142619);--fp-selected:light-dark(#e7eee4,#314a37);font:14px/1.6 &quot;Segoe UI&quot;,&quot;Microsoft YaHei&quot;,sans-serif;background:var(--fp-bg);color:var(--fp-ink);border:1px solid var(--fp-line);border-radius:14px;overflow:clip;min-height:714px;box-sizing:border-box}

#fp-directions .fp-top{min-height:66px;display:flex;align-items:center;gap:34px;padding:12px 22px;background:var(--fp-panel);border-bottom:1px solid var(--fp-line);flex-wrap:wrap}
#fp-directions .fp-brand{font-size:19px;letter-spacing:-.5px;display:flex;align-items:baseline;gap:10px;white-space:nowrap}
#fp-directions .fp-brand&gt;span{font-size:11px;font-weight:400;color:var(--fp-muted)}
#fp-directions .fp-top nav{display:flex;gap:25px;font-size:13px;align-items:center}
#fp-directions .fp-top nav&gt;b{font-weight:600;position:relative;color:var(--fp-accent)}
#fp-directions .fp-top nav&gt;b:after{content:&quot;&quot;;position:absolute;bottom:-19px;left:0;right:0;height:2px;background:var(--fp-accent)}
#fp-directions .fp-top nav&gt;span{color:var(--fp-muted)}

#fp-directions .fp-as-title{display:flex;align-items:center;gap:8px;font-size:14px}

#fp-directions .fp-dot{margin-left:auto;background:var(--fp-accent);width:6px;height:6px;border-radius:50%}
#fp-directions .fp-context{color:var(--fp-muted);font-size:11px;margin-bottom:24px}

#fp-directions .fp-content{padding:27px 25px 22px;min-width:0}

#fp-directions .fp-frame{position:relative;aspect-ratio:16/9;background:var(--fp-line);overflow:hidden;border-radius:7px}

#fp-directions .fp-inspector-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:17px}
#fp-directions .fp-inspector h3{font-size:16px;font-weight:600}
#fp-directions .fp-fields{display:flex;gap:30px;padding:15px 0;border-bottom:1px solid var(--fp-line);flex-wrap:wrap}
#fp-directions .fp-fields span{display:block;font-size:11px;color:var(--fp-muted)}
#fp-directions .fp-fields strong{font-size:12px;font-weight:500}
#fp-directions .fp-copy{margin-top:16px;font-size:12px}
#fp-directions .fp-copy&gt;strong{font-weight:600}

#fp-directions .fp-bottomline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--fp-muted);font-size:11px;margin-top:18px}
#fp-directions .fp-foot{display:flex;align-items:center;gap:18px;justify-content:space-between;padding:11px 22px;border-top:1px solid var(--fp-line);font-size:11px;color:var(--fp-muted);min-height:40px;flex-wrap:wrap}
#fp-directions .fp-foot&gt;span:first-child{color:var(--fp-ink);font-weight:600}
#fp-directions .fp-workbench,#fp-directions .fp-gallery{color-scheme:light}
#fp-directions .fp-gallery{--fp-bg:light-dark(#fbf9f4,#201e1b);--fp-panel:light-dark(#f3f0e8,#27241e);--fp-paper:light-dark(#fffdf9,#322d26);--fp-ink:light-dark(#3b352c,#f0e8dc);--fp-muted:light-dark(#746b5f,#b8ac9a);--fp-line:light-dark(#e4ddd0,#494237);--fp-accent:light-dark(#68522f,#e1c18e);--fp-onaccent:light-dark(#fff,#302514);--fp-selected:light-dark(#eee7da,#453a29)}

#fp-directions .fp-sequence-head{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--fp-muted);margin:22px 0 12px;flex-wrap:wrap}
#fp-directions .fp-sequence-head strong{color:var(--fp-ink);font-weight:500}
#fp-directions .fp-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
#fp-directions .fp-seq-item{padding:0;border:0;background:transparent;text-align:left;overflow:hidden;border-radius:4px;min-width:0}
#fp-directions .fp-seq-item.fp-selected{outline:2px solid var(--fp-accent);outline-offset:3px}
#fp-directions .fp-seq-item img{transform:none;display:block;width:100%;aspect-ratio:16/9;object-fit:cover}

#fp-directions .fp-sr{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
#fp-directions .fp-feedback{color:var(--fp-accent);font-size:12px;margin-top:10px}
@media(max-width:850px){#fp-directions .fp-layout{grid-template-columns:195px minmax(0,1fr)}#fp-directions .fp-content{padding:20px 18px}#fp-directions .fp-edit-layout{grid-template-columns:112px minmax(0,1fr);gap:14px}#fp-directions .fp-top{gap:20px}#fp-directions .fp-brand&gt;span{display:none}#fp-directions .fp-director-stage{grid-template-columns:minmax(0,1fr)}#fp-directions .fp-director-stage .fp-frame{aspect-ratio:16/9}#fp-directions .fp-director-meta dl{grid-template-columns:repeat(4,1fr);gap:8px}#fp-directions .fp-director-meta p,#fp-directions .fp-director-meta&gt;strong,#fp-directions .fp-director-meta&gt;.fp-tag{display:none}#fp-directions .fp-director-meta h3{margin:8px 0}#fp-directions .fp-app{min-height:790px}#fp-directions .fp-layout{min-height:682px}}
@media(max-width:600px){#fp-directions .fp-top{padding:14px;gap:18px;min-height:100px}#fp-directions .fp-project{width:100%;margin:0}#fp-directions .fp-top nav{margin-left:auto;gap:19px}#fp-directions .fp-top nav&gt;b:after{bottom:-8px}#fp-directions .fp-layout{display:flex;flex-direction:column-reverse;min-height:0}#fp-directions .fp-app{min-height:0}#fp-directions .fp-assistant{border-right:0;border-top:1px solid var(--fp-line);padding:18px}#fp-directions .fp-conversation{display:none}#fp-directions .fp-context{margin:0}#fp-directions .fp-composer{margin-top:8px}#fp-directions .fp-composer textarea{min-height:45px}#fp-directions .fp-content{padding:18px 14px}#fp-directions .fp-pagehead h2{font-size:21px}#fp-directions .fp-pagehead{gap:10px}#fp-directions .fp-button{font-size:11px}#fp-directions .fp-edit-layout{display:flex;flex-direction:column}#fp-directions .fp-shotlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}#fp-directions .fp-list-title{grid-column:1/-1;margin:0}#fp-directions .fp-shot{margin:0;padding:8px}#fp-directions .fp-shot em{display:none}#fp-directions .fp-gallery-grid{gap:14px}#fp-directions .fp-tile .fp-frame{aspect-ratio:1.5}#fp-directions .fp-frame&gt;span{font-size:11px;left:5px;bottom:5px}#fp-directions .fp-gallery .fp-pagehead h2{font-size:25px}#fp-directions .fp-gallery-detail{align-items:flex-start;flex-direction:column;gap:10px}#fp-directions .fp-tile-heading{flex-wrap:wrap}#fp-directions .fp-sequence{grid-template-columns:repeat(2,minmax(0,1fr))}#fp-directions .fp-director-meta dl{grid-template-columns:repeat(2,1fr)}#fp-directions .fp-foot{padding:12px 14px;gap:5px}#fp-directions .fp-foot span:last-child{font-size:11px}#fp-directions .fp-fields{gap:24px}}
