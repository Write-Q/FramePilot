        &lt;section class=&quot;fs-sequence&quot; aria-labelledby=&quot;fs-sequence-title&quot;&gt;&lt;div class=&quot;fs-section-heading&quot;&gt;&lt;h2 id=&quot;fs-sequence-title&quot;&gt;故事的四个瞬间&lt;/h2&gt;&lt;span&gt;点选镜头，继续编辑&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fs-shot-grid&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;fs-shot-card cursor-interaction&quot; data-shot=&quot;0&quot; aria-pressed=&quot;false&quot;&gt;&lt;div class=&quot;fs-card-header&quot;&gt;&lt;span&gt;01&lt;/span&gt;&lt;small class=&quot;fs-shot-time&quot;&gt;6 秒&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;fs-card-visual&quot;&gt;&lt;i data-lucide=&quot;image&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;未选用首帧&lt;/span&gt;&lt;/div&gt;&lt;strong&gt;穿过废墟&lt;/strong&gt;&lt;p&gt;远景 &lt;span&gt;·&lt;/span&gt; 平移&lt;/p&gt;&lt;div class=&quot;fs-card-foot&quot;&gt;&lt;span class=&quot;fs-card-dot&quot;&gt;&lt;/span&gt;文字草稿&lt;/div&gt;&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;fs-shot-card cursor-interaction&quot; data-shot=&quot;1&quot; aria-pressed=&quot;false&quot;&gt;&lt;div class=&quot;fs-card-header&quot;&gt;&lt;span&gt;02&lt;/span&gt;&lt;small class=&quot;fs-shot-time&quot;&gt;4 秒&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;fs-card-visual&quot;&gt;&lt;i data-lucide=&quot;image&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;未选用首帧&lt;/span&gt;&lt;/div&gt;&lt;strong&gt;温室入口&lt;/strong&gt;&lt;p&gt;中景 &lt;span&gt;·&lt;/span&gt; 跟拍&lt;/p&gt;&lt;div class=&quot;fs-card-foot&quot;&gt;&lt;span class=&quot;fs-card-dot&quot;&gt;&lt;/span&gt;文字草稿&lt;/div&gt;&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;fs-shot-card cursor-interaction&quot; data-shot=&quot;2&quot; aria-pressed=&quot;true&quot;&gt;&lt;div class=&quot;fs-card-header&quot;&gt;&lt;span&gt;03&lt;/span&gt;&lt;small class=&quot;fs-shot-time&quot;&gt;5 秒&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;fs-card-visual&quot;&gt;&lt;i data-lucide=&quot;image&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;未选用首帧&lt;/span&gt;&lt;/div&gt;&lt;strong&gt;发现花朵&lt;/strong&gt;&lt;p&gt;近景 &lt;span&gt;·&lt;/span&gt; 缓慢推进&lt;/p&gt;&lt;div class=&quot;fs-card-foot&quot;&gt;&lt;span class=&quot;fs-card-dot&quot;&gt;&lt;/span&gt;当前编辑&lt;/div&gt;&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;fs-shot-card cursor-interaction&quot; data-shot=&quot;3&quot; aria-pressed=&quot;false&quot;&gt;&lt;div class=&quot;fs-card-header&quot;&gt;&lt;span&gt;04&lt;/span&gt;&lt;small class=&quot;fs-shot-time&quot;&gt;6 秒&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;fs-card-visual&quot;&gt;&lt;i data-lucide=&quot;image&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;未选用首帧&lt;/span&gt;&lt;/div&gt;&lt;strong&gt;小心守护&lt;/strong&gt;&lt;p&gt;特写 &lt;span&gt;·&lt;/span&gt; 固定&lt;/p&gt;&lt;div class=&quot;fs-card-foot&quot;&gt;&lt;span class=&quot;fs-card-dot&quot;&gt;&lt;/span&gt;文字草稿&lt;/div&gt;&lt;/button&gt;
        &lt;/div&gt;&lt;/section&gt;
        &lt;div class=&quot;fs-bottom-note&quot;&gt;&lt;span&gt;&lt;i data-lucide=&quot;feather&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;把注意力留给故事。&lt;/span&gt;&lt;span&gt;示例文字 · 素材空状态 · 未连接项目服务&lt;/span&gt;&lt;/div&gt;
      &lt;/main&gt;
    &lt;/div&gt;
    &lt;div class=&quot;fs-notification&quot; id=&quot;fs-notification&quot; role=&quot;status&quot; hidden&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;style&gt;
#fp-soft-studio{--fs-ink:#293644;--fs-muted:#65717f;--fs-line:#dfe4e8;--fs-accent:#365c83;--fs-sky:#deedf7;--fs-lavender:#eee9fa;--fs-paper:#fffefa;--fs-radius:14px;font:14px/1.6 &quot;Segoe UI&quot;,&quot;Microsoft YaHei&quot;,sans-serif;color:var(--fs-ink);color-scheme:light;width:100%;padding:16px;background:linear-gradient(150deg,var(--fs-sky) 0%,#ebeff4 45%,#f5f0e8 100%);border-radius:22px}
#fp-soft-studio *{box-sizing:border-box}
#fp-soft-studio h1,#fp-soft-studio h2,#fp-soft-studio h3,#fp-soft-studio p{margin:0}
#fp-soft-studio button,#fp-soft-studio input,#fp-soft-studio select,#fp-soft-studio textarea{font:inherit;color:inherit}
#fp-soft-studio button{transition:background-color .16s ease,box-shadow .16s ease}
#fp-soft-studio button:disabled{opacity:.6;cursor:not-allowed}
#fp-soft-studio :focus-visible{outline:2px solid var(--fs-accent);outline-offset:3px}
#fp-soft-studio ::selection{background:#d8e7f3;color:#243d55}
#fp-soft-studio textarea,#fp-soft-studio input{caret-color:var(--fs-accent)}
#fp-soft-studio ::placeholder{color:#6a7581;opacity:1}
#fp-soft-studio .fs-shell{background:#f8fafb;border-radius:16px;box-shadow:0 12px 35px #35496814,0 2px 5px #3549680b;overflow:clip;position:relative}
#fp-soft-studio .fs-topbar{min-height:65px;padding:13px 21px;display:flex;align-items:center;gap:22px;background:var(--fs-paper);border-bottom:1px solid var(--fs-line);flex-wrap:wrap}
#fp-soft-studio .fs-wordmark{display:flex;align-items:center;gap:9px;min-width:193px}
#fp-soft-studio .fs-wordmark strong{font-family:&quot;Segoe UI&quot;,sans-serif;font-size:19px;font-weight:650;letter-spacing:-.7px}
#fp-soft-studio .fs-wordmark svg{width:19px;height:19px;color:#4a617b}
#fp-soft-studio .fs-topbar nav{display:flex;gap:5px;background:#f0f2f4;padding:4px;border-radius:8px;font-size:12px}
#fp-soft-studio .fs-topbar nav&gt;*{padding:5px 19px;font-weight:500;color:var(--fs-muted)}
#fp-soft-studio .fs-topbar nav&gt;strong{color:var(--fs-ink);background:#fff;border-radius:5px;box-shadow:0 1px 3px #22354b13}
#fp-soft-studio .fs-preview-label{margin-left:auto;color:var(--fs-muted);font-size:11px}
#fp-soft-studio svg{width:15px;height:15px;flex-shrink:0;stroke-width:1.6}
#fp-soft-studio .fs-icon-button{width:29px;min-height:29px;background:transparent;border:0;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;padding:5px}
#fp-soft-studio .fs-icon-button:hover{background:#e9eef3}
#fp-soft-studio .fs-mobile-panels{display:none}
#fp-soft-studio .fs-body{display:grid;grid-template-columns:230px minmax(0,1fr)}
#fp-soft-studio .fs-assistant{background:#fafaf6;border-right:1px solid var(--fs-line);padding:22px 17px 12px;display:flex;flex-direction:column;min-width:0}
#fp-soft-studio .fs-project{display:flex;align-items:center;gap:10px;padding-bottom:22px;border-bottom:1px solid #e8e8e1}
#fp-soft-studio .fs-project-cover{width:34px;height:42px;display:grid;place-items:center;flex-shrink:0;background:#d9e7ee;border-radius:4px 7px 7px 4px;box-shadow:inset 3px 0 0 #bdcfdc,1px 2px 3px #384c6310;color:#48627b}
#fp-soft-studio .fs-project-cover svg{width:19px;height:19px}
#fp-soft-studio .fs-project strong{font-size:13px;font-weight:600}
#fp-soft-studio .fs-project small{display:block;font-size:11px;color:var(--fs-muted);margin-top:3px}
#fp-soft-studio .fs-assistant-heading{display:flex;align-items:center;justify-content:space-between;margin-top:26px}
#fp-soft-studio .fs-assistant-heading h2{font-size:14px;font-weight:600}
#fp-soft-studio .fs-quiet-label{font-size:11px;color:var(--fs-muted)}
#fp-soft-studio .fs-context{display:flex;gap:6px;align-items:center;font-size:11px;color:#5f647a;background:#f0edf6;padding:7px 9px;border-radius:6px;margin:12px 0 28px}
#fp-soft-studio .fs-context svg{width:13px;height:13px}
#fp-soft-studio .fs-conversation{flex:1;font-size:12px;line-height:1.95}
#fp-soft-studio .fs-message{margin-bottom:23px}
#fp-soft-studio .fs-message&gt;span{color:var(--fs-muted);font-size:11px;display:flex;align-items:center;gap:6px;margin-bottom:7px}
#fp-soft-studio .fs-message&gt;p{overflow-wrap:anywhere}
#fp-soft-studio .fs-assistant-name svg{width:13px;height:13px}
#fp-soft-studio .fs-suggestion{padding:15px 0 16px;margin:0 0 30px;border-top:1px solid #e3e4dd;border-bottom:1px solid #e3e4dd}
#fp-soft-studio .fs-note-label{font-size:11px;font-weight:600;color:#626077}
#fp-soft-studio .fs-suggestion p{font-size:12px;margin:7px 0 11px;color:#596575}
#fp-soft-studio .fs-text-button{font-size:11px;background:transparent;border:0;padding:0;color:var(--fs-accent);display:inline-flex;align-items:center;gap:4px;text-align:left;text-underline-offset:3px}
#fp-soft-studio .fs-text-button:hover{text-decoration:underline}
#fp-soft-studio .fs-text-button svg{width:13px;height:13px}
#fp-soft-studio .fs-composer{background:#fff;border-radius:11px;padding:12px;box-shadow:0 2px 8px #3b4f6410,0 0 0 1px #dde3e6}
#fp-soft-studio .fs-composer textarea{background:transparent;border:0;width:100%;resize:vertical;min-height:63px;max-height:160px;display:block;font-size:12px;line-height:1.8;padding:0}
#fp-soft-studio .fs-composer-bottom{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:10px;color:var(--fs-muted);font-size:11px}
#fp-soft-studio .fs-send{border:0;background:#e5edf3;color:#365575;padding:5px 7px;border-radius:5px;display:flex;gap:4px;align-items:center;font-size:11px}
#fp-soft-studio .fs-send:hover{background:#d9e6f0}
#fp-soft-studio .fs-local-status{margin:9px 0 0;font-size:11px;color:var(--fs-muted);overflow-wrap:anywhere}
#fp-soft-studio .fs-main{padding:30px 25px 16px;min-width:0;background:linear-gradient(160deg,#ecf3f8 0%,#f5f4f2 65%,#f6f4ee 100%)}
#fp-soft-studio .fs-title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:23px;flex-wrap:wrap}
#fp-soft-studio .fs-title-row h1{font:500 25px/1.5 &quot;Noto Serif SC&quot;,&quot;Songti SC&quot;,&quot;SimSun&quot;,serif;letter-spacing:-.6px;text-wrap:balance;color:#344a5c}
#fp-soft-studio .fs-title-row p{font-size:11px;color:var(--fs-muted);margin-top:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#fp-soft-studio .fs-title-row p&gt;span{color:#7a8490}
#fp-soft-studio .fs-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #d8e0e7;border-radius:6px;background:#fff;padding:7px 10px;min-height:32px;font-size:11px;white-space:nowrap}
#fp-soft-studio .fs-button:hover{background:#f2f6f9}
#fp-soft-studio .fs-primary{background:#354d65;color:#fff;border-color:transparent;box-shadow:0 2px 3px #30496016}
#fp-soft-studio .fs-primary:hover{background:#2d4258}
#fp-soft-studio .fs-primary svg{width:13px;height:13px}
#fp-soft-studio .fs-workspace-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:25px;flex-wrap:wrap}
#fp-soft-studio .fs-view-toggle{display:flex;gap:2px;padding:3px;background:#e2e9ef;border-radius:7px}
#fp-soft-studio .fs-view-toggle button{padding:6px 10px;border:0;background:transparent;border-radius:5px;font-size:11px;color:#5d6c7b;display:flex;gap:5px;align-items:center;white-space:nowrap}
#fp-soft-studio .fs-view-toggle button[aria-pressed=true]{background:#fff;color:#354c63;box-shadow:0 1px 3px #344f6a12}
#fp-soft-studio .fs-view-toggle svg{width:13px;height:13px}
#fp-soft-studio .fs-save-state{font-size:11px;color:#617369;display:flex;align-items:center;gap:5px}
#fp-soft-studio .fs-status-dot{width:5px;height:5px;background:#6e8b78;border-radius:50%}
#fp-soft-studio .fs-editor{background:var(--fs-paper);border-radius:var(--fs-radius);padding:19px 18px 15px;box-shadow:0 5px 16px #3d526013,0 1px 2px #3d52600a;position:relative}
#fp-soft-studio .fs-paper-tab{position:absolute;top:-13px;left:18px;font-size:11px;color:#746540;background:#f4eac8;padding:3px 13px;border-radius:5px 5px 0 0;box-shadow:0 -1px 1px #7f6b3910}
#fp-soft-studio .fs-editor-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}
#fp-soft-studio .fs-shot-heading{display:flex;align-items:center;gap:10px}
#fp-soft-studio .fs-shot-heading&gt;span{font:500 12px/1 &quot;Segoe UI&quot;,sans-serif;color:#617082;background:#edf1f5;padding:7px;border-radius:5px;font-variant-numeric:tabular-nums}
#fp-soft-studio .fs-shot-heading h2{font-size:15px;font-weight:600}
#fp-soft-studio .fs-shot-navigation{display:flex;gap:4px;color:#677584}
#fp-soft-studio .fs-editor-grid{display:grid;grid-template-columns:minmax(0,1fr) 183px;gap:20px}
#fp-soft-studio .fs-frame-tabs{display:flex;align-items:center;gap:17px;padding:0 0 10px;font-size:11px}
#fp-soft-studio .fs-frame-tabs button{background:transparent;border:0;color:var(--fs-muted);padding:0 0 4px;font-size:11px;border-bottom:1px solid transparent}
#fp-soft-studio .fs-frame-tabs button[aria-pressed=true]{color:var(--fs-accent);border-bottom-color:var(--fs-accent)}
#fp-soft-studio .fs-frame-tabs&gt;span{margin-left:auto;color:var(--fs-muted);font-variant-numeric:tabular-nums}
#fp-soft-studio .fs-empty-frame{min-height:204px;aspect-ratio:16/10;border-radius:8px;background:#edf2f5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;color:#596c7e}
#fp-soft-studio .fs-empty-icon{width:43px;height:43px;border-radius:10px;background:#f9fbfc;box-shadow:0 4px 9px #3d5b7610;display:grid;place-items:center;margin-bottom:15px;color:#75899b}
#fp-soft-studio .fs-empty-icon svg{width:21px;height:21px;stroke-width:1.3}
#fp-soft-studio .fs-empty-frame strong{font-size:12px;font-weight:500}
#fp-soft-studio .fs-empty-frame p{font-size:11px;color:#647687;margin-top:5px}
#fp-soft-studio .fs-empty-frame&gt;span{font-size:11px;color:#647687;max-width:22ch;margin-top:17px}
#fp-soft-studio .fs-frame-caption{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:#637586}
#fp-soft-studio .fs-frame-caption&gt;span{display:flex;gap:4px;align-items:center}
#fp-soft-studio .fs-frame-caption svg{width:12px;height:12px}
#fp-soft-studio .fs-inspector-title{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:14px}
#fp-soft-studio .fs-inspector h3{font-size:12px;font-weight:600}
#fp-soft-studio .fs-label-lavender{font-size:11px;color:#6a5e84;background:var(--fs-lavender);padding:1px 5px;border-radius:4px}
#fp-soft-studio .fs-setting-row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:33px;border-bottom:1px solid #eceeea;font-size:11px}
#fp-soft-studio .fs-setting-row&gt;label{color:var(--fs-muted);white-space:nowrap}
#fp-soft-studio .fs-setting-row select{background:transparent;border:0;font-size:11px;padding:3px 0;max-width:103px;text-align:right;min-width:0}
#fp-soft-studio .fs-duration{display:flex;align-items:center;gap:4px}
#fp-soft-studio .fs-duration input{width:37px;border:0;background:transparent;text-align:right;font-size:11px;padding:3px 0;font-variant-numeric:tabular-nums}
#fp-soft-studio .fs-action-label{display:block;font-size:11px;color:var(--fs-muted);margin:14px 0 7px}
#fp-soft-studio #fs-action{display:block;width:100%;font-size:11px;line-height:1.85;padding:8px 9px;background:#f7f8f5;border:1px solid #e3e7e3;border-radius:5px;resize:vertical;min-height:100px}
#fp-soft-studio .fs-save{margin-top:11px;width:100%;background:#eff3f6;border-color:transparent;color:#455d75}
#fp-soft-studio .fs-sequence{margin-top:25px}
#fp-soft-studio .fs-section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
#fp-soft-studio .fs-section-heading h2{font-size:13px;font-weight:600}
#fp-soft-studio .fs-section-heading&gt;span{color:var(--fs-muted);font-size:11px}
#fp-soft-studio .fs-shot-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
#fp-soft-studio .fs-shot-card{display:block;text-align:left;padding:10px 10px 9px;border:0;background:var(--fs-paper);border-radius:9px;min-width:0;box-shadow:0 3px 7px #344c640a}
#fp-soft-studio .fs-shot-card:hover{background:#f8fbff;box-shadow:0 4px 9px #344c6410}
#fp-soft-studio .fs-shot-card[aria-pressed=true]{background:#f3f0fb;box-shadow:0 0 0 1px #b6acce,0 4px 10px #7f709510}
#fp-soft-studio .fs-card-header{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;color:#67798a;margin-bottom:8px;font-variant-numeric:tabular-nums}
#fp-soft-studio .fs-card-header small{font-size:11px;color:var(--fs-muted)}
#fp-soft-studio .fs-card-visual{aspect-ratio:16/8;background:#edf0f2;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:5px;color:#6b7b89;font-size:11px;margin-bottom:9px;flex-wrap:wrap;padding:7px}
#fp-soft-studio .fs-card-visual svg{width:13px;height:13px}
#fp-soft-studio .fs-shot-card[aria-pressed=true] .fs-card-visual{background:#e8e4f0;color:#726981}
#fp-soft-studio .fs-shot-card&gt;strong{font-size:12px;font-weight:600;display:block;overflow-wrap:anywhere}
#fp-soft-studio .fs-shot-card&gt;p{font-size:11px;color:var(--fs-muted);margin-top:4px}
#fp-soft-studio .fs-shot-card&gt;p&gt;span{padding:0 3px}
#fp-soft-studio .fs-card-foot{margin-top:13px;display:flex;align-items:center;gap:5px;color:#697986;font-size:11px}
#fp-soft-studio .fs-card-dot{width:4px;height:4px;border-radius:50%;background:#90a18e}
#fp-soft-studio .fs-bottom-note{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:22px;color:#6c7982;font-size:11px}
#fp-soft-studio .fs-bottom-note&gt;span:first-child{display:flex;gap:5px;align-items:center;color:#526a7d}
#fp-soft-studio .fs-prompt{margin-top:17px;border-top:1px solid #e4e8ea;padding-top:15px;font-size:11px}
#fp-soft-studio .fs-prompt label{display:block;margin-bottom:8px;color:#526579}
#fp-soft-studio .fs-prompt textarea{width:100%;padding:9px;background:#f6f8f9;border:1px solid #dfe5e9;border-radius:6px;font-size:12px;resize:vertical}
#fp-soft-studio .fs-prompt p{margin-top:6px;color:var(--fs-muted)}
#fp-soft-studio .fs-diff{margin-top:18px;padding-top:14px;border-top:1px solid #e4e8ea;font-size:12px}
#fp-soft-studio .fs-diff strong{font-size:12px;font-weight:500}
#fp-soft-studio .fs-diff&gt;div{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:10px 0 13px}
#fp-soft-studio .fs-diff p{color:#526172;line-height:1.85}
#fp-soft-studio .fs-diff p&gt;span{display:block;color:#727385;font-size:11px;margin-bottom:5px}
#fp-soft-studio .fs-notification{padding:11px 18px;font-size:12px;color:#455e73;background:#e4edf5;border-top:1px solid #d5e1eb}
#fp-soft-studio .fs-sr{position:absolute;width:1px;height:1px;clip-path:inset(50%);white-space:nowrap;overflow:hidden}

      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
