<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FramePilot · 互动故事</title><link rel="stylesheet" href="/static/game.css"><script defer src="/static/game.js"></script></head>
<body><header><a href="/">FRAMEPILOT</a><span>互动故事 / YOUR NEXT MOVE</span><a href="/docs">接口文档</a></header>
<main><aside><div class="intro"><small>从此刻，进入故事</small><h1>下一步，<br>由你决定。</h1><p>你扮演主角。世界回应你的行动，故事留下你的选择。</p></div>
<details open id="opening"><summary>开始一段新故事</summary><form id="new-game"><label for="entry">开局方式</label><select id="entry"><option value="free">自由开局</option><option value="ai">AI 提供背景</option><option value="collaborative">协作创造背景</option></select><label for="requirements">你的想法与要求</label><textarea id="requirements" rows="4" maxlength="4000" placeholder="我在一座所有人都失忆的城市醒来……"></textarea><div id="background-tools" hidden><button type="button" id="suggest" class="outline">生成背景候选</button><div id="candidates"></div><label for="feedback">协作反馈（可选）</label><textarea id="feedback" rows="2" maxlength="2000" placeholder="希望更温暖一点，主角是个修理工。"></textarea></div><label for="background">确认的故事背景</label><textarea id="background" required maxlength="5000" rows="4" placeholder="选中候选或写下背景，可以修改后再开始。"></textarea><label for="death">失败与死亡</label><select id="death"><option value="adventure">冒险 · 可死亡，可回溯</option><option value="story">故事 · 保留生命，失败推动剧情</option><option value="hardcore">硬核 · 可死亡，禁用回溯</option></select><label class="check"><input type="checkbox" id="initial-stats" checked> 显示属性与判定数值</label><label class="check"><input type="checkbox" id="initial-images" checked> 关键节点自动插图</label><p class="note">文字和图片请求可能产生费用。每局文字最多100次、图片20次；背景候选单独调用，失败请求也计数。</p><button type="submit">确认背景，进入故事 →</button></form></details>
<section class="save-list"><h2>继续你的故事</h2><button id="reload-list" class="outline">刷新存档</button><div id="sessions"></div></section></aside>
<article><div id="message" role="status" aria-live="polite">从左侧开局，或者载入已有存档。</div><div id="game" hidden><div class="toolbar"><label for="branch">当前路线</label><select id="branch"></select><button class="outline" id="refresh">刷新</button><a id="export">导出故事</a></div><div class="settings"><label class="check"><input id="stats-toggle" type="checkbox"> 显示数值</label><label class="check"><input id="images-toggle" type="checkbox"> 自动插图</label></div><p id="budget" class="note"></p><div id="state"></div><div id="history"></div><div class="composer"><div id="choices"></div><form id="act"><label for="action">你的行动或对话</label><textarea id="action" maxlength="2000" rows="3" required placeholder="我先假装失忆，观察其他人。"></textarea><button id="act-button">行动 →</button></form><div id="recovery" hidden><p>这一步还没完成。重试保留已有判定。</p><button id="retry">重试当前步骤</button><button id="cancel" class="outline">取消待处理行动</button></div></div></div></article></main><footer>每条路线都保留你的选择 · 图片生成失败时，故事仍可继续</footer></body></html>
