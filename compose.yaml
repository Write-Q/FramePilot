services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: framepilot
      POSTGRES_USER: framepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 设置数据库密码}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framepilot -d framepilot"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
